<!DOCTYPE html>
<html lang="pt-BR">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!-- Define o tema antes dos estilos para evitar o clarão ao navegar -->
      <script>
          try {
              document.documentElement.setAttribute(
                  "data-theme",
                  localStorage.getItem("taskberry-theme") === "dark" ? "dark" : "light"
              );
          } catch (e) {
              document.documentElement.setAttribute("data-theme", "light");
          }
      </script>

      <title>{% block title %}TaskBerry | Gestão e Otimização{% endblock %}</title>

      <!-- Bootstrap 5 -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

      <!-- Bootstrap Icons -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet">

      <!-- Fonte -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet">

      <!-- CSS próprio -->
      <link rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css', v='20261118-4') }}">
            
            <!-- CSS modo escuro -->
      <link rel="stylesheet"
            href="{{ url_for('static', filename='css/themes.css', v='20261118-4') }}">

      {% block extra_css %}{% endblock %}
</head>

<body data-require-delete-password="{{ 'true' if preferencias_taskberry.exigir_senha_exclusao else 'false' }}">

    {% block content %}
    {% endblock %}

    {% if preferencias_taskberry.mostrar_botao_topo %}
    <button type="button"
            id="taskberryBackToTop"
            class="taskberry-back-to-top"
            aria-label="Voltar ao início da página"
            title="Voltar ao topo">
        <i class="bi bi-arrow-up"></i>
    </button>
    {% endif %}

    {% include 'components/confirmacao_modal.html' %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript próprio -->
    <script src="{{ url_for('static', filename='js/script.js', v='20261120-1') }}"></script>

    <!-- JavaScript modo escuro -->
    <script src="{{ url_for('static', filename='js/theme.js', v='20261118-3') }}"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
